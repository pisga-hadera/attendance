<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<title>נוכחות השתלמויות - פסג"ה חדרה</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --pg-orange:       #F9A349;
  --pg-turquoise:    #6ECBD9;
  --pg-coral:        #F16E60;
  --pg-deep-teal:    #52A9B6;
  --pg-orange-ink:   #A85410;
  --pg-teal-ink:     #256069;
  --pg-coral-ink:    #A82E20;
  --pg-teal-solid:   #2E7580;
  --pg-text:         #2A2B2D;
  --pg-body:         #4A4C4F;
  --pg-muted:        #6B6E71;
  --pg-on-orange:    #3D2A12;
  --pg-on-turquoise: #123338;
  --pg-tint:         #DDE8EB;
  --pg-orange-tint:  #FEF6EC;
  --pg-teal-tint:    #EDF9FB;
  --pg-surface:      #F7F8F8;
  --pg-border:       #E3E6E7;
  --pg-bg:           #FFFFFF;
  --pg-radius-sm: 8px;
  --pg-radius:    16px;
  --pg-radius-lg: 24px;
  --pg-radius-pill: 999px;
  --pg-font-head: 'Rubik', 'Assistant', 'Arial Hebrew', sans-serif;
  --pg-font-body: 'Assistant', 'Rubik', 'Arial Hebrew', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #16191B; --pg-surface: #1F2325; --pg-border: #33383B;
    --pg-tint: #1A2124; --pg-orange-tint: #2A1F14; --pg-teal-tint: #14262A;
    --pg-text: #F2F4F4; --pg-body: #C9CCCE; --pg-muted: #9BA0A3;
    --pg-orange-ink: #F9A349; --pg-teal-ink: #6ECBD9; --pg-coral-ink: #F16E60;
  }
}
* { box-sizing: border-box; }
body {
  font-family: var(--pg-font-body); background: var(--pg-tint); margin:0; direction: rtl;
  color: var(--pg-text); min-height:100vh;
}
.pg-header {
  display:flex; align-items:center; justify-content:space-between; padding: 16px 20px;
  background: var(--pg-bg); border-bottom: 1px solid var(--pg-border);
}
.pg-header .pg-textlogo { font-family: var(--pg-font-head); font-weight:700; font-size:1.125rem; color: var(--pg-teal-ink); }
.pg-admin-link {
  display:flex; align-items:center; gap:6px; text-decoration:none; color: var(--pg-teal-ink);
  font-size:0.8125rem; font-weight:600; background: var(--pg-teal-tint); padding:7px 12px;
  border-radius: var(--pg-radius-pill); white-space:nowrap;
}
.pg-admin-link:hover { background: var(--pg-tint); }
.wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }
h1 {
  font-family: var(--pg-font-head); font-weight:700; color: var(--pg-text);
  font-size: clamp(1.4rem, 5vw, 1.8rem); line-height:1.3; text-align:center; margin: 8px 0 0;
}
.pg-seam { height:4px; border:0; border-radius:2px; margin: 14px 0 22px;
  background: linear-gradient(to left, var(--pg-orange) 50%, var(--pg-turquoise) 50%); }
.card {
  background: var(--pg-bg); border-radius: var(--pg-radius-lg); padding: 22px;
  margin-bottom: 18px; box-shadow: 0 2px 8px rgba(37,96,105,.08), 0 12px 32px rgba(37,96,105,.06);
}
label { display:block; font-size:0.9375rem; font-weight:600; color: var(--pg-body); margin: 14px 0 6px; }
input[type=text], select {
  width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid var(--pg-border);
  border-radius: var(--pg-radius-sm); font-size:1.0625rem; font-family: var(--pg-font-body);
  background: var(--pg-surface); color: var(--pg-text);
}
input[type=text]:focus, select:focus { outline:2px solid var(--pg-turquoise); outline-offset:1px; }
button.pg-btn {
  font-family: var(--pg-font-body); font-weight:700; font-size:1.0625rem; border:none; cursor:pointer;
  border-radius: var(--pg-radius-pill); padding: 14px 20px; width:100%; margin-top:16px;
  transition: transform .08s ease;
}
button.pg-btn:active { transform: scale(0.98); }
button.pg-btn.primary { background: var(--pg-orange); color: var(--pg-on-orange); }
button.pg-btn.primary:disabled { opacity:.55; cursor:default; }
.result-item {
  padding:14px 16px; border:1px solid var(--pg-border); border-radius: var(--pg-radius);
  margin-top:10px; cursor:pointer; background: var(--pg-teal-tint); color: var(--pg-teal-ink);
  font-weight:600; transition: background .12s ease;
}
.result-item:hover { background: var(--pg-tint); }
.row {
  display:flex; align-items:center; justify-content:space-between; padding:12px 4px;
  border-bottom:1px solid var(--pg-border);
}
.row:last-child { border-bottom:none; }
.name { font-size:1.0625rem; font-weight:600; }
.toggle { display:flex; gap:8px; }
.toggle button {
  padding:9px 18px; border-radius: var(--pg-radius-pill); border:1px solid var(--pg-border);
  background: var(--pg-surface); color: var(--pg-muted); cursor:pointer; font-size:0.9375rem;
  font-family: var(--pg-font-body); font-weight:600; transition: all .12s ease;
}
.toggle button.present.on { background: var(--pg-orange); border-color: var(--pg-orange); color: var(--pg-on-orange); }
.toggle button.absent.on { background: var(--pg-teal-solid); border-color: var(--pg-teal-solid); color: #fff; }
.msg { margin-top:14px; padding:14px 16px; border-radius: var(--pg-radius); font-size:0.9375rem; font-weight:600; }
.msg.ok { background: var(--pg-orange-tint); color: var(--pg-orange-ink); }
.msg.err { background: #FBEAEA; color: var(--pg-coral-ink); }
.spinner { text-align:center; margin-top:12px; font-size:0.9375rem; color: var(--pg-muted); display:none; }
.hidden { display:none; }
.subtitle { text-align:center; color: var(--pg-muted); font-size:0.9375rem; margin-top:6px; }
.pg-brand { text-decoration:none; display:flex; align-items:center; }
.pg-logo { height:40px; display:block; }
</style>
</head>
<body>
<div class="pg-header">
  <a class="pg-brand" href="index.html"><img class="pg-logo" src="logo.png" alt="פסג&quot;ה חדרה" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="pg-textlogo" style="display:none">פסג"ה חדרה</span></a>
  <a class="pg-admin-link" href="admin.html">⚙️ למסך ניהול</a>
</div>
<div class="wrap">
  <h1>אפליקצית סימון נוכחות<br>פסג"ה חדרה</h1>
  <p class="subtitle">איתור ההשתלמות שלך וסימון מי הגיע היום</p>
  <hr class="pg-seam">

  <div class="card" id="searchCard">
    <label for="searchInput">מספר ההשתלמות במצפן, או שם המנחה</label>
    <input type="text" id="searchInput" placeholder="לדוגמה: 201412 או דנה כהן">
    <button class="pg-btn primary" id="searchBtn">🔍 חיפוש</button>
    <div class="spinner" id="searchSpinner">מחפשת...</div>
    <div id="searchResults"></div>
    <div class="spinner" id="loadCourseSpinner">טוענת רשימת משתתפים...</div>
  </div>

  <div class="card hidden" id="attendanceCard">
    <h2 id="courseTitle" style="margin-top:0;color:var(--pg-teal-ink);font-family:var(--pg-font-head);font-size:1.25rem;"></h2>
    <label for="dateSelect">תאריך המפגש</label>
    <select id="dateSelect"></select>
    <input type="text" id="sessionDate" style="margin-top:8px;" placeholder="DD/MM/YYYY" inputmode="numeric">
    <div class="spinner" id="dateLoadSpinner">טוענת סימונים קיימים...</div>
    <div id="participantsList"></div>
    <p id="progressNote" style="text-align:center;color:var(--pg-muted);font-size:0.875rem;margin-top:10px;"></p>
    <button class="pg-btn primary" id="submitAttBtn" disabled>✅ שלח נוכחות</button>
    <div class="spinner" id="submitSpinner">שולחת ומעדכנת...</div>
    <div id="attMsg"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbycWciCqw49AsA_DP1ctMYZPSzWs2LAYT0iuylTO9JY_td-LM6K_1AD7abUJ9GqTloT/exec';

  async function api(action, params) {
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, params: params || {} }) });
    } catch (e) {
      throw new Error('אין חיבור לשרת. בדקי את החיבור לאינטרנט ונסי שוב.');
    }
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('התקבלה תשובה לא תקינה מהשרת.'); }
    if (!json.ok) throw new Error(json.error || 'שגיאה לא ידועה');
    return json.data;
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  let currentTab = null;
  let attendance = {};       // { k: 'V' | 'X' }
  let totalParticipants = 0;
  let todayStrGlobal = '';
  let dateReqId = 0;         // מונע ממענה ישן לדרוס בחירה חדשה של תאריך

  $('searchBtn').onclick = doSearch;
  $('searchInput').onkeydown = function (ev) { if (ev.key === 'Enter') doSearch(); };
  $('submitAttBtn').onclick = submitAtt;

  async function doSearch() {
    const q = $('searchInput').value.trim();
    if (!q) return;
    $('searchSpinner').style.display = 'block';
    $('searchResults').innerHTML = '';
    try {
      const results = await api('searchCourses', { query: q });
      $('searchSpinner').style.display = 'none';
      showResults(results);
    } catch (e) {
      $('searchSpinner').style.display = 'none';
      $('searchResults').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  }

  function showResults(results) {
    const el = $('searchResults');
    if (!results.length) { el.innerHTML = '<div class="msg err">לא נמצאה השתלמות תואמת 🤔</div>'; return; }
    el.innerHTML = '';
    results.forEach(function (r) {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.innerHTML = '<b>' + esc(r.code) + '</b> — ' + esc(r.name) +
        (r.facilitatorName ? '<br><span style="font-size:0.85rem;color:var(--pg-muted);">מנחה: ' + esc(r.facilitatorName) + '</span>' : '');
      div.onclick = function () { loadCourse(r.tabName, r.code + ' — ' + r.name); };
      el.appendChild(div);
    });
  }

  async function loadCourse(tabName, title) {
    currentTab = tabName;
    $('loadCourseSpinner').style.display = 'block';
    $('searchResults').innerHTML = '';
    let data;
    try {
      data = await api('getCourseAttendanceData', { tabName: tabName });
    } catch (e) {
      $('loadCourseSpinner').style.display = 'none';
      alert(e.message);
      return;
    }
    $('loadCourseSpinner').style.display = 'none';
    $('courseTitle').textContent = '📋 ' + title;
    todayStrGlobal = data.todayStr;
    totalParticipants = data.participants.length;

    const list = $('participantsList');
    list.innerHTML = '';
    data.participants.forEach(function (p) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<span class="name">' + esc(p.name) + '</span>' +
        '<span class="toggle">' +
          '<button type="button" class="present" data-k="' + esc(p.k) + '">נוכח/ת</button>' +
          '<button type="button" class="absent" data-k="' + esc(p.k) + '">נעדר/ת</button>' +
        '</span>';
      list.appendChild(row);
    });
    list.querySelectorAll('button.present').forEach(function (btn) { btn.onclick = function () { setMark(btn.dataset.k, 'V'); }; });
    list.querySelectorAll('button.absent').forEach(function (btn) { btn.onclick = function () { setMark(btn.dataset.k, 'X'); }; });

    // בוחר תאריכים: מפגש חדש (ברירת מחדל), או אחד הקיימים לעדכון
    const sel = $('dateSelect');
    sel.innerHTML = '<option value="">🆕 מפגש חדש (' + esc(data.todayStr) + ')</option>' +
      data.existingDates.map(function (d) { return '<option value="' + esc(d) + '">📝 עדכון מפגש קיים - ' + esc(d) + '</option>'; }).join('');
    sel.onchange = onDateChoiceChange;
    sel.value = '';
    $('attMsg').innerHTML = '';
    onDateChoiceChange();

    $('searchCard').classList.add('hidden');
    $('attendanceCard').classList.remove('hidden');
  }

  async function onDateChoiceChange() {
    const sel = $('dateSelect');
    const dateInput = $('sessionDate');
    const myReq = ++dateReqId;
    if (sel.value === '') {
      // מפגש חדש - תאריך של היום, אפשר לערוך, הכל ריק ודורש סימון מחדש
      dateInput.value = todayStrGlobal;
      dateInput.readOnly = false;
      resetAllMarks({});
      return;
    }
    // מפגש קיים - שולפים את הסימונים שכבר יש וממלאים מראש
    dateInput.value = sel.value;
    dateInput.readOnly = true;
    resetAllMarks({});
    $('dateLoadSpinner').style.display = 'block';
    try {
      const res = await api('getAttendanceForDate', { tabName: currentTab, dateStr: sel.value });
      if (myReq !== dateReqId) return; // בינתיים נבחר תאריך אחר
      $('dateLoadSpinner').style.display = 'none';
      resetAllMarks(res.marks);
    } catch (e) {
      if (myReq !== dateReqId) return;
      $('dateLoadSpinner').style.display = 'none';
      alert(e.message);
    }
  }

  /** מאפסת/ממלאת את כל כפתורי הסימון לפי מפה של {k: 'V'|'X'|''} (ריק = עדיין לא סומן). */
  function resetAllMarks(marksMap) {
    attendance = {};
    document.querySelectorAll('.row').forEach(function (row) {
      const pBtn = row.querySelector('button.present');
      const aBtn = row.querySelector('button.absent');
      const k = pBtn.dataset.k;
      const mark = marksMap[k] || '';
      if (mark) attendance[k] = mark;
      pBtn.classList.toggle('on', mark === 'V');
      aBtn.classList.toggle('on', mark === 'X');
    });
    updateProgress();
  }

  function setMark(k, mark) {
    attendance[k] = mark;
    document.querySelectorAll('.row').forEach(function (row) {
      const pBtn = row.querySelector('button.present');
      const aBtn = row.querySelector('button.absent');
      if (pBtn.dataset.k === k) {
        pBtn.classList.toggle('on', mark === 'V');
        aBtn.classList.toggle('on', mark === 'X');
      }
    });
    updateProgress();
  }

  function updateProgress() {
    const markedCount = Object.keys(attendance).length;
    const note = $('progressNote');
    const btn = $('submitAttBtn');
    if (markedCount < totalParticipants) {
      note.textContent = 'סומנו ' + markedCount + ' מתוך ' + totalParticipants + ' - יש לסמן את כולם לפני השליחה';
      btn.disabled = true;
    } else {
      note.textContent = 'כל ' + totalParticipants + ' המשתתפים סומנו ✔';
      btn.disabled = false;
    }
  }

  async function submitAtt() {
    const dateStr = $('sessionDate').value.trim();
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dateStr)) { alert('נא להזין תאריך בפורמט DD/MM/YYYY, למשל 16/09/2026'); return; }
    $('submitAttBtn').disabled = true;
    $('submitSpinner').style.display = 'block';
    $('attMsg').innerHTML = '';
    try {
      const res = await api('submitAttendance', { tabName: currentTab, dateStr: dateStr, attendance: attendance });
      $('submitSpinner').style.display = 'none';
      $('attMsg').innerHTML =
        '<div class="msg ok">🎉 הנוכחות נשמרה: ' + esc(res.presentCount) + ' מתוך ' + esc(res.totalCount) +
        ' נוכחים. קובץ למצפן נשלח לרכז, והודעות נשלחו אוטומטית לנעדרים.</div>';
    } catch (e) {
      $('submitSpinner').style.display = 'none';
      $('submitAttBtn').disabled = false;
      $('attMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  }
</script>
</body>
</html>
